[mapping]
# Zuordnung Protokollfeld = Pfad zum DB-Feld, Pfad beginnt bei der Kalibrierung-Instanz
# Beispiele: lookup.seriennummer, kalibrierlauf_23.operator_name, kalibrierlauf_40.set_temp
Seriennummer = lookup.seriennummer
Datum = lookup.date
Operator = kalibrierlauf_23.operator_name
Charge = kalibrierlauf_23.batch
Solltemp_23 = kalibrierlauf_23.set_temp
Solltemp_40 = kalibrierlauf_40.set_temp
Gas = kalibrierlauf_23.gas
Flow_Einheit = lookup.flow_unit

[plots]
# Welche Kalibrierläufe sollen als Diagramme dargestellt werden (key = name, value = attribut auf Kalibrierung)
# Nur kalibrierlauf_verify wird für Protokolle verwendet
Verifikation = kalibrierlauf_verify

[layout]
# Name der erzeugten PDF-Datei (Platzhalter {uid} wird ersetzt)
output_template = rohdaten_{uid}.pdf
title = Kalibrierprotokoll